name: snake_game
description: "A complete Snake game built with Flutter, Flame, and GetX."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.23.0
  flame_audio: ^2.10.0
  get: ^4.6.6
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  flutter_dotenv: ^5.1.0
  dio: ^5.5.0
  crypto: ^3.0.6
  connectivity_plus: ^6.1.3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  google_mobile_ads: ^4.0.0
  tapsell_plus: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/appIcon.png"
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/image/appIcon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/image/
    - assets/image/ModeCard/
    - assets/image/ModeIcon/
    - assets/image/Parts/
    - assets/image/pattern/
    - assets/image/avatar/
    - assets/image/gameBored/
    - assets/image/gameBored/space/
    - assets/image/gameBored/Sea/
    - assets/image/gameBored/ancient/
    - assets/image/gameBored/forest/
    - assets/image/ranks/
    - assets/image/medal/
